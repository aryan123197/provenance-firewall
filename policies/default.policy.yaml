# Amounts are integer minor units (cents). Provenance rules are built in and not configurable here.
name: default
version: 1
currency: USD
approvalThreshold: 50000      # $500.00: strictly above this needs human approval
amountToleranceBps: 500       # 5%: allowed deviation of a T3 amount from the purchase order
limits:
  perPayment: 100000          # $1,000.00
  perVendorPerDay: 150000     # $1,500.00
  totalPerDay: 300000         # $3,000.00
allowedCategories:
  - office_supplies
  - software
  - contractors
velocity:
  maxPerHour: 5
# Optional. A category-specific approval threshold overrides approvalThreshold for that vendor category.
categoryApprovalThresholds: {}
# Optional. UTC weekdays (0 = Sunday ... 6 = Saturday) on which a new payee is denied outright.
newPayeeDenyDays: []
# Optional. Monthly (UTC calendar month) cap per vendor category, in cents. A payment that would pass it is denied.
categoryBudgets: {}
# Optional. Hold for approval when a payment is far above what that vendor has been paid before. Never allows or denies on its own.
# anomaly:
#   amountMultipleBps: 30000   # 3x the vendor's average past payment
#   minHistory: 3              # past payments needed before the average counts
